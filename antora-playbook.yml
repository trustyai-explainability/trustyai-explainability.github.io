site:
  title: TrustyAI
  url: https://trustyai.org
  start_page: docs::main.adoc
content:
  sources:
  - url: .
    start_path: docs
    branches: ['main', 0.8.0, 0.9.0, 0.10.0]
    worktrees: true
    version: 'main'
ui:
  bundle:
    url: ./ui-bundle
output:
  clean: true
urls:
  html_extension_style: drop
antora:
  extensions:
    - require: '@antora/lunr-extension'
      index_latest_only: true
    - require: '@djencks/asciidoctor-mathjax'
    - require: '@sntke/antora-mermaid-extension'
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs
      script_stem: header-scripts
      mermaid_initialize_options:
        start_on_load: true
        theme: base
        theme_variables:
          primary_color: "#e8f1fc"
          primary_text_color: "#222"
          primary_border_color: "#1565c0"
          line_color: "#5d5d5d"
          secondary_color: "#f0f0f0"
          tertiary_color: "#fafafa"
          background: "#fff"
          main_bkg: "#e8f1fc"
          node_border: "#1565c0"
          cluster_bkg: "#f0f4fb"
          cluster_border: "#c1c1c1"
          title_color: "#333"
          edge_label_background: "#fff"
          font_family: "Atkinson, sans-serif"
          font_size: "15px"
        flowchart:
          use_max_width: true